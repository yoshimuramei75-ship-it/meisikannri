<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名刺帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --bg:#e8ebee; --ink:#1a2230; --sub:#5a6472; --line:#cdd3da;
  --ai:#24467a; --ai-ink:#ffffff; --ai-weak:#dfe6f1; --seal:#b3322a; --field:#f5f7f9;
  --shadow:0 1px 0 rgba(26,34,48,.07), 0 10px 22px -14px rgba(26,34,48,.45);
  --gothic:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1e2530; --bg:#12171e; --ink:#e6eaef; --sub:#9aa4b2; --line:#323c49;
    --ai:#8db0e6; --ai-ink:#0f1722; --ai-weak:#24324a; --seal:#e3675d; --field:#171d26;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1e2530; --bg:#12171e; --ink:#e6eaef; --sub:#9aa4b2; --line:#323c49;
  --ai:#8db0e6; --ai-ink:#0f1722; --ai-weak:#24324a; --seal:#e3675d; --field:#171d26;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.9);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.6;min-height:100%}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 120px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:14px}
.brand h1{font-family:var(--mincho);font-weight:700;font-size:34px;letter-spacing:.12em;margin:0;line-height:1.1}
.brand .count{color:var(--sub);font-size:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative}
.search input{width:min(320px,70vw);padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub)}
select.sort{padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;color:var(--ink)}
.ghost:hover{border-color:var(--ai);color:var(--ai)}

.notice{background:var(--paper);border-left:3px solid var(--seal);padding:12px 16px;margin-bottom:18px;color:var(--ink);border-radius:2px}

/* card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.meishi{position:relative;aspect-ratio:91/55;background:var(--paper);border-radius:3px;box-shadow:var(--shadow);padding:16px 18px;text-align:left;border:none;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.meishi:hover{transform:translateY(-1px)}
.meishi .co{font-size:13px;font-weight:700;color:var(--ai);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meishi .role{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meishi .nm{font-family:var(--mincho);font-weight:700;font-size:26px;letter-spacing:.14em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meishi .kana{font-size:11px;color:var(--sub);letter-spacing:.08em;min-height:1em}
.meishi .contact{font-size:11.5px;color:var(--sub);display:flex;flex-direction:column;line-height:1.45}
.meishi .contact span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meishi .thumb{position:absolute;right:12px;top:12px;width:46px;height:28px;object-fit:cover;border-radius:2px;opacity:.9;border:1px solid var(--line)}
.empty{grid-column:1/-1;aspect-ratio:auto;border:1.5px dashed var(--line);border-radius:4px;padding:48px 24px;text-align:center;color:var(--sub);background:transparent}
.empty strong{display:block;font-family:var(--mincho);font-size:20px;color:var(--ink);margin-bottom:6px;font-weight:700}

/* bottom action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
.primary{background:var(--ai);color:var(--ai-ink);border:none;border-radius:999px;padding:14px 26px;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.primary:disabled{opacity:.55;cursor:default}
.secondary{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:13px 20px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.danger{background:none;border:none;color:var(--seal);cursor:pointer;padding:10px 6px;font-weight:500}

/* editor overlay */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));z-index:10}
.overlay.open{display:flex}
.sheet{background:var(--paper);width:min(980px,100%);border-radius:6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);overflow:hidden}
@media (max-width:760px){.sheet{grid-template-columns:1fr}}
.photo{background:#20262f;position:relative;min-height:220px;display:flex;align-items:center;justify-content:center;padding:18px}
.photo img{max-height:70vh;object-fit:contain;border-radius:2px;display:block}
.photo .none{color:#9aa4b2;font-size:14px}
.scan{position:absolute;left:18px;right:18px;height:2px;background:#9cc0ff;box-shadow:0 0 14px 3px rgba(140,180,255,.65);top:18px;display:none}
.reading .scan{display:block;animation:scan 1.8s ease-in-out infinite alternate}
@keyframes scan{from{top:18px}to{top:calc(100% - 20px)}}
@media (prefers-reduced-motion:reduce){.reading .scan{animation:none;top:50%}}
.form{padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.form h2{font-family:var(--mincho);font-size:22px;margin:0;letter-spacing:.08em}
.status{font-size:13.5px;color:var(--sub);min-height:1.4em}
.status.err{color:var(--seal)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
.fields label.full{grid-column:1/-1}
.fields input,.fields textarea{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:8px 10px;font-size:15px;color:var(--ink);width:100%}
.fields textarea{resize:vertical;min-height:60px}
.fields input.big{font-family:var(--mincho);font-size:20px;font-weight:700;letter-spacing:.08em}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick a{font-size:13px;color:var(--ai);text-decoration:none;border:1px solid var(--ai-weak);background:var(--ai-weak);padding:5px 12px;border-radius:999px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .spacer{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>名刺帳</h1><span class="count" id="count"></span></div>
    <div class="tools">
      <label class="search"><span class="sr">検索</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="会社名・名前・メールで検索">
      </label>
      <select class="sort" id="sort" aria-label="並び順">
        <option value="new">登録が新しい順</option>
        <option value="company">会社名順</option>
        <option value="name">名前順</option>
      </select>
      <button class="ghost" id="exportBtn" hidden>CSVで書き出す</button>
    </div>
  </header>
  <div id="notice" class="notice" hidden></div>
  <div class="grid" id="grid"></div>
</div>

<div class="actionbar">
  <button class="primary" id="shootBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    名刺を撮影する
  </button>
  <button class="secondary" id="pickBtn">写真から選ぶ</button>
</div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="fileInput" accept="image/*" hidden>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet">
    <div class="photo" id="photoBox">
      <img id="photo" alt="名刺の写真" hidden>
      <span class="none" id="noPhoto">写真なし</span>
      <div class="scan"></div>
    </div>
    <div class="form">
      <h2 id="sheetTitle">新しい名刺</h2>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="quick" id="quick"></div>
      <div class="fields">
        <label class="full">会社名<input id="f_company" autocomplete="off"></label>
        <label>部署<input id="f_department" autocomplete="off"></label>
        <label>肩書<input id="f_title" autocomplete="off"></label>
        <label>氏名<input id="f_name" class="big" autocomplete="off"></label>
        <label>ふりがな<input id="f_name_kana" autocomplete="off"></label>
        <label>電話<input id="f_phone" type="tel" autocomplete="off"></label>
        <label>携帯<input id="f_mobile" type="tel" autocomplete="off"></label>
        <label>FAX<input id="f_fax" type="tel" autocomplete="off"></label>
        <label>メール<input id="f_email" type="email" autocomplete="off"></label>
        <label class="full">住所<input id="f_address" autocomplete="off"></label>
        <label class="full">Webサイト<input id="f_url" autocomplete="off"></label>
        <label class="full">メモ（会った場所・話した内容など）<textarea id="f_memo"></textarea></label>
      </div>
      <div class="row">
        <button class="danger" id="deleteBtn" hidden>この名刺を削除</button>
        <button class="ghost" id="rereadBtn" hidden>もう一度読み取る</button>
        <span class="spacer"></span>
        <button class="secondary" id="closeBtn">閉じる</button>
        <button class="primary" id="saveBtn">保存する</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const FIELDS = ["company","department","title","name","name_kana","phone","mobile","fax","email","address","url","memo"];
  const OCR_FIELDS = FIELDS.filter(f => f !== "memo");
  const $ = id => document.getElementById(id);

  let cards = [];
  let editing = null;   // {id|null, imageBlob|null, localUrl|null}
  let ocrCtl = null;
  let saving = false;
  let loaded = false;

  function toast(msg){
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2400);
  }
  function notice(msg){ const n=$("notice"); if(!msg){n.hidden=true;return;} n.textContent=msg; n.hidden=false; }
  function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function setStatus(msg, err){ const s=$("status"); s.textContent=msg||""; s.classList.toggle("err", !!err); }
  function imgUrl(c){ return "/api/cards/" + c.id + "/image?v=" + encodeURIComponent(c.updated_at || ""); }

  async function api(url, opts){
    const r = await fetch(url, opts);
    if (r.status === 204) return null;
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || "通信に失敗しました（" + r.status + "）");
    return body;
  }

  async function shrink(file){
    let bmp;
    try { bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }
    catch(e){
      bmp = await new Promise((res, rej) => {
        const img = new Image(); img.onload = () => res(img); img.onerror = rej;
        img.src = URL.createObjectURL(file);
      });
    }
    const w = bmp.width, h = bmp.height, max = 1600;
    const s = Math.min(1, max / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.round(w*s); c.height = Math.round(h*s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", 0.86));
  }

  function render(){
    const grid = $("grid");
    grid.textContent = "";
    $("count").textContent = loaded ? cards.length + "枚" : "";
    $("exportBtn").hidden = !cards.length;
    if (!loaded) return;
    const q = $("q").value.trim().toLowerCase();
    let list = cards.filter(c => !q || FIELDS.some(f => String(c[f]||"").toLowerCase().includes(q)));
    const sort = $("sort").value;
    const coll = new Intl.Collator("ja");
    if (sort === "company") list.sort((a,b)=>coll.compare(a.company||"\uffff", b.company||"\uffff"));
    else if (sort === "name") list.sort((a,b)=>coll.compare(a.name_kana||a.name||"\uffff", b.name_kana||b.name||"\uffff"));
    else list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

    if (!cards.length){
      const e = el("div","empty");
      e.append(el("strong",null,"まだ名刺がありません"));
      e.append(el("span",null,"下の「名刺を撮影する」で1枚目を登録すると、会社名や名前を自動で読み取ります。"));
      grid.append(e); return;
    }
    if (!list.length){
      const e = el("div","empty");
      e.append(el("strong",null,"見つかりません"));
      e.append(el("span",null,"「"+$("q").value+"」に一致する名刺はありません。"));
      grid.append(e); return;
    }
    for (const c of list){
      const b = el("button","meishi");
      b.type = "button";
      b.setAttribute("aria-label", (c.name||"名前未入力") + " " + (c.company||""));
      const top = el("div");
      top.append(el("div","co", c.company || "会社名なし"));
      const role = [c.department, c.title].filter(Boolean).join("  ");
      top.append(el("div","role", role || "\u00a0"));
      const mid = el("div");
      mid.append(el("div","kana", c.name_kana || ""));
      mid.append(el("div","nm", c.name || "名前未入力"));
      const ct = el("div","contact");
      if (c.phone || c.mobile) ct.append(el("span",null, "TEL " + (c.mobile || c.phone)));
      if (c.email) ct.append(el("span",null, c.email));
      b.append(top, mid, ct);
      if (c.has_image){ const t = el("img","thumb"); t.alt=""; t.loading="lazy"; t.src=imgUrl(c); t.onerror=()=>t.remove(); b.append(t); }
      b.onclick = () => openExisting(c);
      grid.append(b);
    }
  }

  function fillForm(data){ for (const f of FIELDS) $("f_"+f).value = (data && data[f]) || ""; updateQuick(); }
  function readForm(){ const o={}; for (const f of FIELDS) o[f] = $("f_"+f).value.trim(); return o; }
  function updateQuick(){
    const q = $("quick"); q.textContent = "";
    if (!editing || !editing.id) return;
    const tel = $("f_mobile").value.trim() || $("f_phone").value.trim();
    const mail = $("f_email").value.trim();
    if (tel){ const a=el("a",null,"電話をかける"); a.href="tel:"+tel.replace(/[^\d+]/g,""); q.append(a); }
    if (mail){ const a=el("a",null,"メールを送る"); a.href="mailto:"+mail; q.append(a); }
  }
  function showPhoto(url){
    const img = $("photo");
    if (url){ img.src = url; img.hidden = false; $("noPhoto").hidden = true; }
    else { img.removeAttribute("src"); img.hidden = true; $("noPhoto").hidden = false; }
  }
  function openOverlay(){ $("overlay").classList.add("open"); document.body.style.overflow="hidden"; }
  function closeOverlay(){
    if (ocrCtl) { ocrCtl.abort(); ocrCtl = null; }
    $("overlay").classList.remove("open"); document.body.style.overflow="";
    $("photoBox").classList.remove("reading");
    if (editing && editing.localUrl) URL.revokeObjectURL(editing.localUrl);
    editing = null;
  }

  function openExisting(c){
    editing = { id:c.id, imageBlob:null, localUrl:null };
    $("sheetTitle").textContent = "名刺の詳細";
    fillForm(c);
    showPhoto(c.has_image ? imgUrl(c) : null);
    $("deleteBtn").hidden = false;
    $("rereadBtn").hidden = true;
    setStatus("");
    openOverlay();
  }

  async function openNew(file){
    if (!file) return;
    let blob;
    try { blob = await shrink(file); }
    catch(e){ toast("この画像は読み込めません。JPEGかPNGの写真を選んでください。"); return; }
    const localUrl = URL.createObjectURL(blob);
    editing = { id:null, imageBlob:blob, localUrl };
    $("sheetTitle").textContent = "新しい名刺";
    fillForm(null);
    showPhoto(localUrl);
    $("deleteBtn").hidden = true;
    $("rereadBtn").hidden = false;
    openOverlay();
    runOcr();
  }

  async function runOcr(){
    if (!editing || !editing.imageBlob) return;
    if (ocrCtl) ocrCtl.abort();
    const ctl = new AbortController(); ocrCtl = ctl;
    const target = editing;
    $("photoBox").classList.add("reading");
    setStatus("名刺を読み取っています…（10〜30秒ほど）");
    $("rereadBtn").disabled = true;
    try {
      const fd = new FormData();
      fd.append("image", target.imageBlob, "card.jpg");
      const data = await api("/api/ocr", { method:"POST", body:fd, signal:ctl.signal });
      if (editing !== target) return;
      let filled = 0;
      for (const f of OCR_FIELDS){
        const v = typeof data[f] === "string" ? data[f].trim() : "";
        const input = $("f_"+f);
        if (v && !input.value.trim()){ input.value = v; filled++; }
      }
      updateQuick();
      setStatus(filled ? "読み取りました。内容を確認して「保存する」を押してください。"
                       : "文字を読み取れませんでした。名刺全体が明るく写るように撮り直すか、手で入力してください。", !filled);
    } catch(e){
      if (editing !== target || e.name === "AbortError") return;
      setStatus(e.message + " 「もう一度読み取る」を押すか、手で入力してください。", true);
    } finally {
      if (ocrCtl === ctl) ocrCtl = null;
      if (editing === target){ $("photoBox").classList.remove("reading"); $("rereadBtn").disabled = false; }
    }
  }

  async function save(){
    if (saving || !editing) return;
    const data = readForm();
    if (!data.name && !data.company){ setStatus("会社名か氏名のどちらかを入力してください。", true); $("f_name").focus(); return; }
    saving = true; $("saveBtn").disabled = true; setStatus("保存しています…");
    const target = editing;
    try {
      if (target.id){
        const row = await api("/api/cards/" + target.id, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data) });
        cards = cards.map(c => c.id === row.id ? row : c);
        toast("変更を保存しました");
      } else {
        const fd = new FormData();
        fd.append("data", JSON.stringify(data));
        if (target.imageBlob) fd.append("image", target.imageBlob, "card.jpg");
        const row = await api("/api/cards", { method:"POST", body:fd });
        cards.unshift(row);
        toast("名刺を保存しました");
      }
      closeOverlay();
      render();
    } catch(e){
      setStatus(e.message, true);
    } finally {
      saving = false; $("saveBtn").disabled = false;
    }
  }

  async function del(){
    if (!editing || !editing.id) return;
    const name = $("f_name").value || $("f_company").value || "この名刺";
    if (!confirm(name + " を削除しますか？写真も削除され、元に戻せません。")) return;
    const id = editing.id;
    try {
      await api("/api/cards/" + id, { method:"DELETE" });
      cards = cards.filter(c => c.id !== id);
      toast("削除しました");
      closeOverlay();
      render();
    } catch(e){ setStatus(e.message, true); }
  }

  function exportCsv(){
    if (!cards.length) return;
    const head = ["会社名","部署","肩書","氏名","ふりがな","電話","携帯","FAX","メール","住所","Webサイト","メモ","登録日"];
    const q = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';
    const rows = cards.map(c => FIELDS.map(f=>q(c[f])).concat(q(new Date(c.created_at).toLocaleDateString("ja-JP"))).join(","));
    const csv = "\ufeff" + [head.map(q).join(",")].concat(rows).join("\r\n");
    const url = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
    const a = el("a"); a.href = url; a.download = "meishi.csv"; document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  $("shootBtn").onclick = () => $("camInput").click();
  $("pickBtn").onclick = () => $("fileInput").click();
  for (const id of ["camInput","fileInput"]){
    $(id).onchange = e => { const f = e.target.files && e.target.files[0]; e.target.value = ""; openNew(f); };
  }
  $("closeBtn").onclick = closeOverlay;
  $("saveBtn").onclick = save;
  $("deleteBtn").onclick = del;
  $("rereadBtn").onclick = () => { for (const f of OCR_FIELDS) $("f_"+f).value = ""; runOcr(); };
  $("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeOverlay(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && editing) closeOverlay(); });
  ["f_phone","f_mobile","f_email"].forEach(id => $(id).addEventListener("input", updateQuick));
  $("q").addEventListener("input", render);
  $("sort").addEventListener("change", render);
  $("exportBtn").onclick = exportCsv;

  (async function load(){
    $("count").textContent = "読み込み中…";
    try { cards = await api("/api/cards"); notice(""); }
    catch(e){ notice("名刺一覧を読み込めませんでした。" + e.message + " ページを再読み込みしてください。"); }
    loaded = true; render();
  })();
})();
</script>
</body>
</html>
